name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérification
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configuration de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Vérification JavaScript
        run: |
          node --check taoqanslander.js
          node --check 'functions/[[data]].js'

      - name: Vérification HTML
        run: npx --yes htmlhint@1.6.3 index.html