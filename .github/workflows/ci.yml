name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérification JS
        run: node --check taoqanslander.js
      - name: Vérification HTML
        run: |
          npm install -g htmlhint
          htmlhint index.html
